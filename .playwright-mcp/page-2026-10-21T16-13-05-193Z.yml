        - article [ref=f9e366]:
          - heading "Judging Criteria" [level=3] [ref=f9e368]
          - list [ref=f9e370]:
            - listitem [ref=f9e371]:
              - strong [ref=f9e372]: Technical Execution (General)
              - text: Code quality, working functionality, and the difficulty of what was built. Weighted 35%.
            - listitem [ref=f9e373]:
              - strong [ref=f9e374]: Innovation & Originality
              - text: How novel the idea or approach is. Weighted 25%.
            - listitem [ref=f9e375]:
              - strong [ref=f9e376]: Completeness & Polish (General)
              - text: How finished the project is. Rough edges, broken features, and unfinished flows lose points. Weighted 25%.
            - listitem [ref=f9e377]:
              - strong [ref=f9e378]: Presentation & Demo Clarity (General)
              - text: How clearly the demo video and writeup explain what was built. Weighted 15%.
            - listitem [ref=f9e379]:
              - strong [ref=f9e380]: Impact on Waste Problem (Theme)
              - text: How meaningfully the project reduces, sorts, or improves recycling of waste. The theme must be central, not bolted on. Weighted 35%.
            - listitem [ref=f9e381]:
              - strong [ref=f9e382]: Technical Execution (Theme)
              - text: Code quality, working functionality, and the difficulty of what was built. Weighted 25%.
            - listitem [ref=f9e383]:
              - strong [ref=f9e384]: Feasibility (Theme)
              - text: Could this actually be deployed in the real world? A working solution beats a clever one that can't ship. Weighted 20%.
            - listitem [ref=f9e385]:
              - strong [ref=f9e386]: Presentation & Demo Clarity (Theme)
              - text: How clearly the demo video and writeup explain what was built. Weighted 20%.
