    - generic [ref=e133]:
      - generic [ref=e134]:
        - article [ref=e135]:
          - paragraph [ref=e136]:
            - text: "Remember: Join the"
            - link "Discord" [ref=e137] [cursor=pointer]:
              - /url: https://discord.gg/bMbhhDrqe
            - text: for announcments!
          - paragraph [ref=e138]:
            - strong [ref=e139]: About the challenge
          - paragraph [ref=e140]: Arbiter Hacks V1 runs two parallel tracks. Pick one when you register, or switch before the submission deadline. You may only submit to one track.
          - paragraph [ref=e141]:
            - strong [ref=e142]: "General Track:"
            - text: Build anything. Any language, any stack, any idea. This track rewards technical ambition and execution, regardless of subject.
          - paragraph [ref=e143]:
            - strong [ref=e144]: "Theme Track, Rethinking Waste:"
            - text: Build something that helps people or systems reduce, sort, or recycle waste more effectively. Examples include a tool that identifies whether an item is recyclable, an app that routes food waste to donation, a hardware or vision system that sorts materials, or a dataset or model that improves recycling accuracy. If it moves the needle on waste, it fits.
          - paragraph [ref=e145]: The tracks are judged separately, against separate rubrics, for separate prizes. A polished General submission and a high-impact Theme submission compete only within their own track.
          - paragraph [ref=e146]:
            - strong [ref=e147]: Get started
          - list [ref=e148]:
            - listitem [ref=e149]: Register and pick a track.
            - listitem [ref=e150]: Form a team of [1 to 4] or go solo.
            - listitem [ref=e151]: Late submissions are not judged.
        - article [ref=e152]:
          - heading "Requirements" [level=3] [ref=e154]
          - generic [ref=e156]:
            - paragraph [ref=e157]:
              - strong [ref=e158]: What to Build
            - paragraph [ref=e159]:
              - emphasis [ref=e160]: "General Track:"
              - text: Any working software or hardware project. No topic restriction.
            - paragraph [ref=e161]:
              - emphasis [ref=e162]: "Theme Track:"
              - text: A project whose primary purpose addresses waste reduction, sorting, or recycling. Judges will check that the theme is central to the project, not bolted on. A to-do app with a "recycling" label is a General project, not a Theme one.
            - paragraph [ref=e163]:
              - strong [ref=e164]: What to Submit
            - paragraph [ref=e165]: "Every submission must include:"
            - list [ref=e166]:
              - listitem [ref=e167]: A public code repository (GitHub, GitLab, or equivalent).
              - listitem [ref=e168]: A demo video, [2 to 3] minutes max, showing the project working. Upload to YouTube or Vimeo and link it.
              - listitem [ref=e169]: "A written description: what it does, how you built it, and what you'd do next."
              - listitem [ref=e170]: "Theme Track only: one paragraph stating the specific waste problem you targeted and how you'd measure whether it worked."
            - paragraph [ref=e171]
            - paragraph [ref=e172]: Missing the repo or the video makes a submission ineligible.
